name: Avanex
description: 'Avanex Corporation was a fiber-optic components manufacturer founded
  in 1997 and headquartered in Fremont, California, backed by Mayfield along with
  Crosspoint Venture Partners, JAFCO America and Sequoia Capital. Avanex designed and
  built photonic processors, optical components, modules and subsystems used to raise
  the speed and capacity of fiber-optic communication networks, and went public on
  NASDAQ in February 2000 raising $216 million. In April 2009 Avanex merged with
  Bookham Technology to form Oclaro, and Oclaro was in turn acquired by Lumentum in
  December 2018. Avanex is no longer an operating company: it publishes no developer
  portal, documentation, or API of any kind, and the avanex.com domain is now a
  parked GoDaddy for-sale listing. This profile is retained as a historical
  portfolio-lineage record only.'
